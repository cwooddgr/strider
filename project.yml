name: Strider
options:
  bundleIdPrefix: com.strider
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false

targets:
  Strider:
    type: application
    platform: iOS
    sources:
      - path: Strider
    settings:
      base:
        INFOPLIST_FILE: Strider/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Strider.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.strider.app
    entitlements:
      path: Strider.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  StriderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StriderTests
    dependencies:
      - target: Strider
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  Strider:
    build:
      targets:
        Strider: all
        StriderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StriderTests
